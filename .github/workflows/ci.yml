name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test-windows:
    name: test (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8: the oldest supported. 3.11: what the Windows program bundles.
        python: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # As a contributor would: the package and its dev extras.
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  test-linux:
    name: test (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install -e ".[dev]"
      # The window's tests need a display: a virtual one.
      - run: xvfb-run -a python -m pytest

  # The oldest systems the .deb claims, with THEIR Python and libraries - not
  # pip's newest: Ubuntu 20.04 (Python 3.8, cryptography 2.8, evdev 1.3) and
  # Debian 11 (Python 3.9, cryptography 3.3). Only pytest comes from pip.
  test-old-distros:
    name: test (${{ matrix.image }}, its own Python and libraries)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:20.04", "debian:11"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      # Debian 11 is past the end of its long-term support: its security
      # archive is leaving the mirrors (404s), while its release packages -
      # the versions that matter here - are still served. Use those alone.
      - run: grep -rl bullseye-security /etc/apt/ 2>/dev/null | xargs -r sed -i '/bullseye-security/d'
      - run: apt-get update
      - run: >
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          python3 python3-tk python3-evdev python3-cryptography python3-pip
          xvfb xauth
      - run: python3 -m pip install "pytest>=7,<9"
      - run: |
          python3 --version
          python3 -c "import cryptography, evdev, tkinter; print('cryptography', cryptography.__version__, '| Tk', tkinter.TkVersion)"
      - run: xvfb-run -a python3 -m pytest -p no:cacheprovider link/tests

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python link/packaging/build-deb.py
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

  # The package installs, with its dependencies resolved by apt, on the
  # oldest and newest systems it claims - and the program imports there.
  deb-install:
    name: install .deb (${{ matrix.image }})
    needs: deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04", "debian:11", "debian:12"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb
      # Debian 11 is past the end of its long-term support: its security
      # archive is leaving the mirrors (404s), while its release packages -
      # the versions that matter here - are still served. Use those alone.
      - run: grep -rl bullseye-security /etc/apt/ 2>/dev/null | xargs -r sed -i '/bullseye-security/d'
      - run: apt-get update
      - run: DEBIAN_FRONTEND=noninteractive apt-get install -y ./nishro-link_*.deb
      - run: |
          cd /usr/lib/nishro-link
          python3 -c "import link.secure, link.node, link.desk, link.nishro_link; print('imports: ok')"
          python3 -m link.nishro_link --help > /dev/null && echo "command line: ok"
          test -x /usr/bin/nishro-link && echo "launcher: ok"
          # The encryption, end to end, with this system's own cryptography.
          python3 -c "from link import secure as s; a, pa = s.keypair(); b, pb = s.keypair(); tx, _ = s.session(s.shared(a, pb), 'k', 'n1', 'n2', 'hub'); _, rx = s.session(s.shared(b, pa), 'k', 'n1', 'n2', 'dialer'); assert rx.open(tx.seal(b'hi')) == b'hi'; assert s.unwrap(s.wrap(b'pw', 'k', 'a', 'b'), 'k', 'a', 'b') == b'pw'; print('encryption: ok')"
          dpkg -s nishro-link | grep -E '^(Status|Version)'
