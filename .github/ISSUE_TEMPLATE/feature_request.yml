name: Feature request
description: An idea to make Nishro Link better
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way - more useful than a solution alone.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Which systems, how many computers and monitors.
